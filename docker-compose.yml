services:
  server:
    build: .
    env_file: .env
    environment:
      # Heatmap screenshots. Resolves only when the "heatmaps" profile is up;
      # without it, heatmaps fall back to text.
      SCREENSHOT_URL: ${SCREENSHOT_URL:-http://renderer:8080}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Screenshot renderer for tap heatmaps (headless Chromium). Optional:
  #   docker compose --profile heatmaps up -d
  # Not published on a host port; only the server reaches it.
  renderer:
    build: ./renderer
    profiles: ["heatmaps"]
    environment:
      RENDERER_TOKEN: ${SCREENSHOT_TOKEN:-}
    mem_limit: 1g
    shm_size: 256m
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tga} -d ${POSTGRES_DB:-tganalytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
